name: FileTrail verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend transaction and failure tests
        run: mvn -B -f backend/pom.xml verify
      - name: Persist uploads across process crashes
        run: python3 scripts/restart_check.py
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Run PostgreSQL and S3 deployment
        run: |
          python3 scripts/configure.py
          docker compose up --build -d --wait --wait-timeout 180
      - name: HTTP acceptance suite
        run: python3 scripts/smoke.py
      - name: Browser regression suite
        working-directory: frontend
        env:
          E2E_URL: http://127.0.0.1:4173
        run: npm run test:e2e
      - name: Retain test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            backend/target/surefire-reports/
            frontend/playwright-report/
            frontend/test-results/
      - name: Show deployment diagnostics on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose ps -a
            docker compose logs --no-color --tail=200 api worker postgres minio
          fi
      - name: Stop test stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down
          fi
